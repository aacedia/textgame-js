<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жизнь студента</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles-base.css">
  <link rel="stylesheet" href="css/styles-location.css">
  <link rel="stylesheet" href="css/styles-actions.css">
  <link rel="stylesheet" href="css/styles-log.css">
  <link rel="stylesheet" href="css/styles-info.css">
  <link rel="stylesheet" href="css/styles-side.css">
  <link rel="stylesheet" href="css/styles-controls.css">
  <link rel="stylesheet" href="css/styles-dialog.css">
  <link rel="stylesheet" href="css/styles-footer.css">
  <link rel="stylesheet" href="css/styles-responsive.css">
</head>

<body>
  <div class="game">
    <div class="layout">
      <!-- Левая колонка: вкладки (задания/инвентарь) и управление -->
      <aside class="side">
        <!-- Верхняя часть: вкладки, растягивается и скроллится -->
        <div class="side-top">
          <section class="panel">
            <div class="tabs" id="tabs"></div>
            <div class="tabcontent" id="side-content"></div>
          </section>
        </div>
        <!-- Нижняя часть: управление, прижато к низу -->
        <div class="side-bottom">
          <section class="panel">
            <button type="button" class="heading-base heading--toggle" id="controls-toggle" aria-expanded="false"
              aria-controls="controls-content">
              <span class="heading-label">Управление</span>
              <span class="heading-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="controls-content" hidden>
              <div class="sidecontent menubuttons">
                <button data-command="save">Сохранить</button>
                <button data-command="load">Загрузить</button>
                <button data-command="help">Справка</button>
                <button data-command="cheat">Чит-код</button>
                <button data-command="restart">Начать заново</button>
              </div>
            </div>
          </section>
        </div>
      </aside>
      <main class="main">
        <!-- Верхняя часть главной колонки: растягивается и скроллится -->
        <div class="main-top">
          <section class="panel">
            <div class="heading-base location-title">
              <span class="locname" id="location-name"></span>
              <span class="tag" id="location-tag"></span>
            </div>
            <div class="location-notice" id="location-notice" hidden></div>
            <div class="description" id="description" aria-live="polite"></div>
            <figure class="location-image" id="location-image" hidden>
              <img id="location-image-img" alt="">
              <figcaption id="location-image-caption"></figcaption>
            </figure>
          </section>
          <section class="panel" id="info-panel" hidden>
            <div class="heading-base">Информация</div>
            <div class="info" id="info-list" aria-live="polite"></div>
          </section>
        </div>
        <!-- Нижняя часть главной колонки: прижата к низу -->
        <div class="main-bottom">
          <section class="panel">
            <div class="heading-base">Доступные действия</div>
            <div class="actions" id="actions"></div>
          </section>
          <section class="panel">
            <button type="button" class="heading-base heading--toggle" id="log-toggle" aria-expanded="false"
              aria-controls="log-body">
              <span class="heading-label">История событий</span>
              <span class="heading-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="log-body" hidden>
              <div class="log" id="log" aria-live="polite"></div>
            </div>
          </section>
        </div>
      </main>
      <!-- Правая колонка: персонаж -->
      <aside class="side-right">
        <div class="side-top">
          <section class="panel">
            <div class="heading-base">Персонаж</div>
            <div class="status" id="status"></div>
            <div class="character-panel" id="character-content"></div>
          </section>
        </div>
      </aside>
    </div>
  </div>
  <!-- Оверлей «Игра окончена» -->
  <div class="game-over" id="game-over" hidden>
    <div class="game-over__card">
      <h2>Игра окончена</h2>
      <p>Ты потерял сознание. Здоровье на нуле.</p>
      <button id="game-over-restart">Начать заново</button>
    </div>
  </div>
  <dialog id="dialog">
    <div class="dialoghead" id="dialog-title"></div>
    <div class="dialogbody" id="dialog-body"></div>
    <div class="dialogactions" id="dialog-actions"></div>
  </dialog>
  <dialog id="cheat-dialog">
    <div class="dialoghead">Чит-код</div>
    <div class="dialogbody">
      <label for="cheat-input" class="cheat-label">Команда:</label>
      <input id="cheat-input" type="text" class="cheat-input" autocomplete="off">
    </div>
    <div class="dialogactions">
      <button id="cheat-cancel">Отмена</button>
      <button id="cheat-apply" class="primary">Применить</button>
    </div>
  </dialog>
  <dialog id="dialogue-dialog">
    <div class="dialogue-header">
      <div class="dialogue-avatar" id="dialogue-avatar">
        <img id="dialogue-avatar-img" alt="">
      </div>
      <div class="dialogue-info">
        <div class="dialogue-name" id="dialogue-name"></div>
        <div class="dialogue-relation">
          <div class="dialogue-relation__label">
            Отношение: <span id="dialogue-relation-value"></span>
          </div>
          <div class="dialogue-relation__track">
            <div class="dialogue-relation__fill" id="dialogue-relation-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="dialogbody" id="dialogue-body"></div>
    <div class="dialogactions dialogue-choices" id="dialogue-actions"></div>
  </dialog>
  <script src="js/data/data.js"></script>
  <script src="js/data/character.js"></script>
  <script src="js/data/tracks.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/dialogues/rin.js"></script>
  <script src="js/data/dialogues/yui.js"></script>
  <script src="js/data/dialogues/hinako.js"></script>
  <script src="js/data/dialogues/niko.js"></script>
  <script src="js/data/dialogues/hitori.js"></script>
  <script src="js/data/dialogues/ritsu.js"></script>
  <script src="js/data/dialogues/secretary.js"></script>
  <script src="js/data/locations/apartment.js"></script>
  <script src="js/data/locations/gloomy-street.js"></script>
  <script src="js/data/locations/residential.js"></script>
  <script src="js/data/locations/center.js"></script>
  <script src="js/data/locations/capital-street.js"></script>
  <script src="js/data/locations/university.js"></script>
  <script src="js/data/locations/library.js"></script>
  <script src="js/data/locations/gym.js"></script>
  <script src="js/data/locations/shop.js"></script>
  <script src="js/data/locations/shop-center.js"></script>
  <script src="js/data/locations/electronics.js"></script>
  <script src="js/data/locations/cafe.js"></script>
  <script src="js/data/locations/park.js"></script>
  <script src="js/data/locations/glitch-street.js"></script>
  <script src="js/data/locations/computer-club.js"></script>
  <script src="js/data/locations/ramen.js"></script>
  <script src="js/data/locations/rock-bar.js"></script>
  <script src="js/data/data-validation.js"></script>
  <script src="js/rules/rules.js"></script>
  <script src="js/rules/rules-conditions.js"></script>
  <script src="js/rules/rules-effects.js"></script>
  <script src="js/save/save.js"></script>
  <script src="js/ui/ui-core.js"></script>
  <script src="js/ui/ui-side.js"></script>
  <script src="js/ui/ui-controls.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/game/game-state.js"></script>
  <script src="js/game/game-viewmodel.js"></script>
  <script src="js/game/game-actions.js"></script>
  <script src="js/game/game-commands.js"></script>
  <script src="js/game/game.js"></script>
</body>

</html>
